<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="kanto-site" content="familytest">
  <meta name="kanto-dev" content="fam39">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kanto TEST">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/tablet-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/tablet-icon-180.png">
  <title>Pokémon Kanto TEST — stół</title>
  <link rel="stylesheet" href="src/table/table.css">
</head>
<body class="tabletop">
  <header id="topbar" class="topbar" aria-label="Pasek gry"></header>
  <main class="stage">
    <div id="board" class="board" aria-label="Plansza Kanto"></div>
    <section id="table" class="table-layer" aria-label="Stół"></section>
    <div id="rocket-pin" class="rocket-pin" hidden></div>
    <div id="overlay" class="overlay-layer" aria-live="polite"></div>
  </main>
  <footer id="mat" class="mat" aria-label="Plansza gracza"></footer>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="notice" class="notice-layer" role="alertdialog" aria-live="assertive" hidden></div>

  <dialog id="setup-dialog" class="sheet">
    <form id="setup-form" method="dialog">
      <h2>Nowa gra</h2>
      <h3>Kto gra?</h3>
      <div class="setup-players"></div>
      <h3>Kości</h3>
      <div class="setup-modes"></div>
      <p class="small muted dev-pilots" hidden></p>
      <div class="setup-row">
        <label>Limit czasu <select name="timeLimit"></select></label>
        <label>Ziarno <input name="seed" size="14"></label>
        <button type="button" id="btn-seed" class="icon-btn" aria-label="Losuj ziarno"><svg class="ic ic-dices gi gi-roll" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="12" height="12" x="2" y="10" rx="2" ry="2" /><path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6" /><path d="M6 18h.01" /><path d="M10 14h.01" /><path d="M15 6h.01" /><path d="M18 9h.01" /></svg></button>
      </div>
      <div class="row end">
        <button value="cancel" formnovalidate class="ghost">Anuluj</button>
        <button value="start" class="primary big">Zaczynamy!</button>
      </div>
    </form>
  </dialog>

  <dialog id="settings-dialog" class="sheet">
    <h2>Ustawienia</h2>
    <label class="setting">Tempo AI
      <select name="aiDelay">
        <option value="1800">wolno</option>
        <option value="1100">normalnie</option>
        <option value="500">szybko</option>
      </select>
    </label>
    <label class="setting"><input type="checkbox" name="showOdds"> Pokaż szanse łapania (tryb testowy)</label>
    <label class="setting"><input type="checkbox" name="duelHints" checked> Pojedynki: pokazuj przewagę typów na kartach</label>
    <label class="setting"><input type="checkbox" name="foeMoveNames"> Walka: pokazuj nazwy dodatkowych ataków przeciwnika (wyłączone: „???”)</label>
    <p class="muted small">Ziarno gry: <code class="seed">—</code></p>
    <p class="muted small build-label">Build 3.9 TEST — Legendarny Zapdos · <code class="build-id">952ee90</code></p>
    <p class="muted small">Ta gra: <b class="game-variant">—</b></p>
    <!-- PLAYTEST_008 (review 15.10): only in a test scenario's tab (?scenario=…) — the iPad switches scenarios here; the family game never shows it.
         Folded by default (Piotr 15.10): one line in ⚙️, a tap opens the list. -->
    <details class="scenario-switch" hidden>
      <summary>Scenariusze testowe</summary>
      <p class="small muted">Każdy ma osobny zapis, gra rodzinna zostaje nietknięta. Dotknięcie zaczyna scenariusz od nowa.</p>
      <div class="tool-links"></div>
    </details>
    <p class="small save-status" hidden></p>
    <div class="row wrap">
      <button data-settings="new" class="primary">Nowa gra</button>
      <button data-settings="export">Eksport stanu (JSON)</button>
      <button data-settings="close" class="ghost">Zamknij</button>
    </div>
  </dialog>

  <dialog id="inspect-dialog" class="sheet inspect-sheet" aria-label="Karta Pokémona">
    <div class="inspect-body"></div>
    <div class="row center"><button data-inspect-close class="primary">Zamknij</button></div>
  </dialog>

  <dialog id="art-editor" class="sheet art-editor" aria-label="Kadr portretu"></dialog>

  <dialog id="save-dialog" class="sheet">
    <h2>Zapisana gra</h2>
    <div class="save-problem"></div>
    <div class="row wrap end">
      <button data-save="download">Pobierz kopię zapisu</button>
      <button data-save="reload" hidden>Odśwież stronę</button>
      <button data-save="ok" class="primary">Rozumiem</button>
    </div>
  </dialog>

  <script type="module" src="src/table/main.js"></script>
  <script>
    // Offline cache for the HTTPS / installed build (tablet). Not on the
    // local dev server (npm start), so development never sees stale files.
    if ('serviceWorker' in navigator && window.isSecureContext && location.hostname !== 'localhost') {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
